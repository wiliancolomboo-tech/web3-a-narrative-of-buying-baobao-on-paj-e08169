version: "3.8"

services:
  baobao-paj-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: baobao-paj-execution-worker
    restart: unless-stopped
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"